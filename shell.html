<title>Marginalia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@500;700;800&family=Cinzel:wght@500;700;800&family=Cinzel+Decorative:wght@700;900&display=swap">
<style>
:root{
  color-scheme:dark;
  --vault:#0F2A2E;--leather:#1E4A42;--leather2:#153832;
  --gold:#E0B354;--gold-hi:#F6DA8E;--gold-lo:#A87A2A;
  --parch:#F4E7C9;--parch2:#E6D2A6;--ink:#2A1E17;--ink2:#5A4432;
  --ox:#8E2F37;--ox-hi:#C4453C;--lapis:#2E5597;
  --text:#F2E6CC;--muted:#AFC0B6;
  --disp:'Cinzel',Georgia,'Times New Roman',serif;
  --logo:'Cinzel Decorative','Cinzel',Georgia,serif;
  --body:'Alegreya',Georgia,'Times New Roman',serif;
  --ui:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --noise:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--vault);color:var(--text);font-family:var(--body);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,rgba(5,15,17,.25),rgba(5,15,17,.7));opacity:0;transition:opacity .8s}
body:not(.onTitle) #shade{opacity:1}
body.illum #shade{background:radial-gradient(ellipse at 50% 40%,rgba(60,40,5,.05),rgba(5,15,17,.55))}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}

/* ---------- HUD ---------- */
#hud{flex:none;display:flex;align-items:center;gap:18px;padding:10px 16px;background:linear-gradient(180deg,rgba(6,20,22,.92),rgba(6,20,22,.7));border-bottom:1px solid rgba(224,179,84,.28);box-shadow:0 8px 24px rgba(0,0,0,.25);flex-wrap:wrap}
.hud-cell{display:flex;align-items:center;gap:8px;font-family:var(--ui)}
.hud-cell b{font:800 20px/1 var(--ui);color:var(--parch);font-variant-numeric:tabular-nums}
.hud-cell small{display:block;font:700 10px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.candle{width:18px;height:34px}
.hud-candle.low .candle{animation:lowpulse 1s ease-in-out infinite}
@keyframes lowpulse{50%{filter:drop-shadow(0 0 6px #ff5a3c)}}
.hud-pages .ic{font-size:24px;color:var(--gold)}
.hud-score{margin-left:auto;text-align:right}
.hud-score b{font-size:24px;color:var(--gold-hi)}
.stamps{display:flex;gap:4px}
.stamps i{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(224,179,84,.45)}
.stamps i.on{background:var(--c);border-color:var(--gold-hi);box-shadow:0 0 6px var(--c)}
.relics{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
.relic-chip{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#F8E3A8,#B98530);color:#3A2410;font-size:16px;box-shadow:0 0 0 1px #5b3d12;transition:transform .15s,box-shadow .15s}
.relic-chip:hover{transform:translateY(-2px) scale(1.08);box-shadow:0 0 0 1px #5b3d12,0 0 10px rgba(224,179,84,.6)}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);font-size:18px;border:1px solid rgba(224,179,84,.35)}
.iconbtn:hover{background:rgba(224,179,84,.12)}
@media (max-width:640px){
  #hud{gap:10px;padding:8px 12px}
  .hud-cell small{display:none}
  .relics{order:9;max-width:none;width:100%}
  .hud-score b{font-size:20px}
}
@media (max-width:480px){.hud-stampcell{display:none}.relics:empty{display:none}}

#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:20px 32px;padding-inline:16px;display:flex;flex-direction:column;align-items:center}

/* ---------- Buttons ---------- */
.btn{font-family:var(--disp);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:14px;padding:13px 22px;border-radius:4px;color:var(--parch);background:linear-gradient(180deg,#24554c,#173c36);box-shadow:inset 0 0 0 1px rgba(224,179,84,.55),inset 0 0 0 4px #1a433c,inset 0 0 0 5px rgba(224,179,84,.2),0 4px 0 #0a1c1a,0 10px 24px rgba(0,0,0,.35);transition:transform .12s,filter .12s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
.btn:active{transform:translateY(1px)}
.btn.gold{color:#2A1E17;background:linear-gradient(180deg,#F8DF98,#D6A13E 60%,#B98530);box-shadow:inset 0 0 0 1px #FFF1C4,inset 0 -3px 0 rgba(0,0,0,.18),0 4px 0 #7a5418,0 12px 30px rgba(224,179,84,.35)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;filter:none}
.btn.small{font-size:12px;padding:9px 14px}

/* ---------- Parchment ---------- */
.parch{color:var(--ink);background-color:var(--parch);background-image:radial-gradient(ellipse at 25% 15%,rgba(255,255,255,.45),transparent 55%),radial-gradient(ellipse at 85% 95%,rgba(160,110,40,.22),transparent 55%),var(--noise)}

/* ---------- Title ---------- */
.title{max-width:900px;width:100%;margin-block:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.eyebrow{font:700 12px var(--disp);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
.logo{font-family:var(--logo);font-weight:900;font-size:clamp(46px,10vw,116px);line-height:.95;margin:0;letter-spacing:.02em;background:linear-gradient(180deg,#FFF3C8 0%,#F0C868 38%,#B7812B 62%,#F6D98A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #4b3210) drop-shadow(0 10px 30px rgba(224,179,84,.35))}
.tagline{font:italic 400 clamp(17px,2vw,21px)/1.45 var(--body);color:var(--parch);max-width:36ch;margin:0}
.t-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.t-stats{font:600 14px var(--ui);color:var(--muted);letter-spacing:.02em}
.t-stats b{color:var(--gold-hi)}
.wings{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:760px}
.wing{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(6,20,22,.66);border:1px solid rgba(224,179,84,.22);font:600 13px var(--ui);color:var(--parch);transition:transform .15s,border-color .15s,background .15s}
.wing:hover{transform:translateY(-2px);border-color:rgba(224,179,84,.55);background:rgba(6,20,22,.85)}
.wing i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#FFF6E0;font-size:14px}
.wing em{font-style:normal;color:var(--muted);font-weight:500}
.t-folio{position:relative;width:170px;margin-top:4px}

/* ---------- Folio ---------- */
.folio-wrap{position:relative;display:flex;justify-content:center;align-items:flex-end}
.folio{width:100%;max-width:170px;height:auto;animation:bob 2.8s ease-in-out infinite;transform-origin:50% 90%;overflow:visible;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.folio .fe{display:none;width:100%;height:auto}
.folio[data-mood="n"] .fe-n,.folio[data-mood="h"] .fe-h,.folio[data-mood="s"] .fe-s{display:block}
.folio.hop{animation:hop .55s cubic-bezier(.3,1.6,.5,1)}
.folio.wince{animation:wince .5s ease-in-out}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.95,1.06)}70%{transform:translateY(0) scale(1.06,.94)}100%{transform:none}}
@keyframes wince{20%,60%{transform:translateX(-6px) rotate(-3deg)}40%,80%{transform:translateX(6px) rotate(3deg)}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translate(-50%,6px) scale(.9);background:var(--parch);color:var(--ink);font:800 15px var(--ui);padding:6px 13px;border-radius:14px;white-space:nowrap;opacity:0;transition:opacity .18s,transform .18s;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none;z-index:3}
.bubble::after{content:"";position:absolute;left:50%;top:100%;border:7px solid transparent;border-top-color:var(--parch);transform:translateX(-50%)}
.bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* ---------- Map ---------- */
.mapwrap{width:100%;max-width:680px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-head h2{font:800 clamp(20px,3vw,26px)/1.1 var(--disp);letter-spacing:.05em;margin:0;color:var(--gold-hi);text-wrap:balance}
.sec-head p{margin:4px 0 0;color:var(--muted);font:500 15px/1.4 var(--ui)}
.scroll{position:relative;border-radius:10px;box-shadow:0 0 0 1px #b08a45,0 0 0 6px #173a34,0 0 0 7px var(--gold),0 30px 60px rgba(0,0,0,.5);overflow:hidden}
.scroll>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.floorlab{position:absolute;left:0;width:48px;text-align:center;font:800 15px var(--disp);color:rgba(90,68,50,.55);transform:translateY(-50%)}
.gutter{position:absolute;left:0;top:0;bottom:0;width:48px;border-right:1px solid rgba(90,68,50,.2);background:rgba(90,68,50,.05)}
.floorline{position:absolute;left:0;right:0;border-top:1px dashed rgba(90,68,50,.16)}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#FFF6E0;font-size:26px;background:var(--c);background-image:radial-gradient(circle at 35% 28%,rgba(255,255,255,.42),transparent 58%),radial-gradient(circle at 60% 80%,rgba(0,0,0,.25),transparent 60%);box-shadow:0 0 0 2px #F6DA8E,0 0 0 4px rgba(42,30,23,.85),0 5px 10px rgba(0,0,0,.35);transition:transform .15s}
.node .lab{position:absolute;top:calc(100% + 7px);left:50%;transform:translateX(-50%);width:max-content;max-width:108px;text-align:center;font:800 11px/1.15 var(--ui);color:var(--ink);background:rgba(244,231,201,.9);padding:2px 6px;border-radius:3px;pointer-events:none}
.node.locked{filter:grayscale(.55) brightness(.92);opacity:.72;cursor:default}
.node.done{filter:saturate(.5) brightness(.9);opacity:.85;cursor:default}
.node .chk{position:absolute;right:-4px;bottom:-2px;width:22px;height:22px;border-radius:50%;background:var(--ox);color:#FBE9C8;display:grid;place-items:center;font-size:13px;box-shadow:0 0 0 2px var(--parch)}
.node.avail{animation:npulse 1.5s ease-in-out infinite;cursor:pointer}
.node.avail:hover{transform:translate(-50%,-50%) scale(1.1)}
@keyframes npulse{0%,100%{box-shadow:0 0 0 2px #F6DA8E,0 0 0 4px rgba(42,30,23,.85),0 0 0 4px rgba(224,179,84,.7)}50%{box-shadow:0 0 0 2px #F6DA8E,0 0 0 4px rgba(42,30,23,.85),0 0 0 14px rgba(224,179,84,0)}}
.node.here{box-shadow:0 0 0 2px #F6DA8E,0 0 0 5px var(--ox-hi),0 5px 10px rgba(0,0,0,.35)}
.node.boss{width:84px;height:84px;font-size:46px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 13px var(--ui);color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font-size:12px}

/* ---------- Encounter ---------- */
.enc{width:100%;max-width:1080px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:20px;align-items:start}
.enc-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.enc-side{display:flex;flex-direction:column;gap:12px;position:sticky;top:0}
.enc-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.enc-title{display:flex;align-items:center;gap:10px}
.enc-title .badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#FFF6E0;font-size:22px;box-shadow:0 0 0 2px var(--gold-hi),0 0 0 4px rgba(0,0,0,.4)}
.enc-title h3{margin:0;font:800 19px/1.1 var(--disp);letter-spacing:.05em;color:var(--parch)}
.enc-title small{display:block;font:600 13px var(--ui);color:var(--muted);letter-spacing:.02em}
.prog{display:flex;gap:6px}
.prog i{width:22px;height:6px;border-radius:3px;background:rgba(224,179,84,.2)}
.prog i.ok{background:var(--gold)}
.prog i.bad{background:var(--ox-hi)}
.prog i.cur{background:var(--parch);box-shadow:0 0 8px rgba(244,231,201,.6)}

.card{position:relative;border-radius:8px;padding:30px 30px 24px;box-shadow:0 0 0 1px #b08a45,0 0 0 6px #173a34,0 0 0 7px var(--gold),0 24px 50px rgba(0,0,0,.5);transition:box-shadow .4s}
.card::before{content:"";position:absolute;inset:9px;border:1px solid rgba(138,98,40,.35);border-radius:4px;pointer-events:none}
.card::after,.sheet::after{content:"";position:absolute;top:-10px;left:50%;transform:translate(-50%,0) rotate(45deg);width:15px;height:15px;background:linear-gradient(135deg,#FFF3C8,#E0B354 55%,#B7812B);box-shadow:0 0 0 2px #173a34,0 0 10px rgba(224,179,84,.55);z-index:2;pointer-events:none}
body.illum .card::after{background:linear-gradient(135deg,#FFF9E0,#F6DA8E 55%,#D9A441);box-shadow:0 0 0 2px #5a4210,0 0 14px rgba(246,218,142,.75)}
body.illum .card{box-shadow:0 0 0 1px #b08a45,0 0 0 6px #5a4210,0 0 0 7px var(--gold-hi),0 0 44px 6px rgba(246,218,142,.55),0 24px 50px rgba(0,0,0,.5)}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fuse{position:absolute;left:16px;right:16px;top:-3px;height:7px;border-radius:4px;background:rgba(10,24,24,.9);box-shadow:0 0 0 1px rgba(224,179,84,.5)}
.fuse i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#7A2331,#D9812F 55%,#F6DA8E);width:100%}
.fuse i::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle,#fff8d8 0 25%,#FFC45A 45%,rgba(255,120,40,0) 72%);animation:spark .25s steps(2) infinite}
@keyframes spark{50%{transform:scale(1.35)}}
.fuse.low i{background:linear-gradient(90deg,#7A2331,#C4453C)}
.c-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ribbon{display:inline-flex;align-items:center;gap:7px;font:700 11px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:#FFF6E0;background:var(--c);padding:5px 12px 5px 9px;border-radius:2px;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%)}
.ribbon .ic{font-size:14px}
.kind{font:700 11px var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.clock{margin-left:auto;font:800 18px var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;min-width:3.2em;text-align:right}
.clock.low{color:var(--ox-hi)}
.q{font:500 clamp(20px,2.3vw,27px)/1.32 var(--body);color:var(--ink);margin:16px 0 0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.opt{position:relative;text-align:left;min-height:60px;padding:12px 14px 12px 54px;border-radius:6px;font:500 17px/1.3 var(--body);color:var(--parch);background:linear-gradient(180deg,#27594f,#1a3f39);box-shadow:inset 0 0 0 1px rgba(224,179,84,.5),inset 0 0 0 4px #1c463f,inset 0 0 0 5px rgba(224,179,84,.18),0 3px 0 #0b1f1c;transition:transform .1s,filter .1s,opacity .25s}
.opt:hover{transform:translateY(-2px);filter:brightness(1.12)}
.opt .k{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--disp);color:#2A1E17;background:radial-gradient(circle at 35% 30%,#FFF1C4,#C9923A)}
.opt.ok{color:#2A1E17;background:linear-gradient(180deg,#FBE6A6,#D9A441);box-shadow:inset 0 0 0 1px #FFF4CF,0 0 22px rgba(246,218,142,.7),0 3px 0 #7a5418}
.opt.bad{background:linear-gradient(180deg,#9c3040,#6e1f2b);animation:shake .4s}
.opt.gone{opacity:.28;text-decoration:line-through;pointer-events:none}
.opt.dim{opacity:.5}
.opts.locked .opt{pointer-events:none}
@media (max-width:560px){.opts{grid-template-columns:1fr}.card{padding:26px 18px 20px}}

.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tfb{padding:18px;border-radius:6px;font:800 20px var(--disp);letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 0 0 1px rgba(255,240,200,.45),0 4px 0 rgba(0,0,0,.35)}
.tfb.f{background:linear-gradient(180deg,#9c3040,#6e1f2b);color:#FBE9C8}
.tfb.t{background:linear-gradient(180deg,#2d6a5d,#1a4a40);color:#FBE9C8}
.tfb kbd{font:700 12px var(--ui);padding:2px 7px;border-radius:3px;background:rgba(0,0,0,.25)}
.tfb:hover{filter:brightness(1.15)}
.flash-ok{animation:flashok .45s}
.flash-bad{animation:flashbad .45s}
@keyframes flashok{30%{box-shadow:0 0 0 1px #b08a45,0 0 0 6px #5a4210,0 0 0 7px var(--gold-hi),0 0 60px 14px rgba(246,218,142,.8)}}
@keyframes flashbad{30%{box-shadow:0 0 0 1px #b08a45,0 0 0 6px #5a1010,0 0 0 7px var(--ox-hi),0 0 60px 14px rgba(196,69,60,.7)}}
.lr-count{font:700 13px var(--ui);color:var(--ink2);margin-top:14px;text-align:center}

.est{margin-top:22px;display:grid;gap:10px}
.est-read{text-align:center;font:800 clamp(36px,6vw,54px)/1 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums}
.est-read span{font-size:.45em;color:var(--ink2);margin-left:6px}
.est input[type=range]{width:100%;accent-color:#8E2F37;height:28px}
.est-scale{display:flex;justify-content:space-between;font:600 13px var(--ui);color:var(--ink2);font-variant-numeric:tabular-nums}
.est-btns{display:flex;gap:10px;justify-content:center;align-items:center}
.nudge{width:46px;height:46px;border-radius:50%;font:800 22px var(--ui);color:var(--parch);background:linear-gradient(180deg,#27594f,#1a3f39);box-shadow:inset 0 0 0 1px rgba(224,179,84,.5),0 3px 0 #0b1f1c}
.nl{position:relative;height:56px;margin:4px 6px 0}
.nl-bar{position:absolute;left:0;right:0;top:26px;height:4px;border-radius:2px;background:rgba(90,68,50,.3)}
.nl .band{position:absolute;top:22px;height:12px;border-radius:6px;background:rgba(224,179,84,.45)}
.nl .mk{position:absolute;transform:translateX(-50%);font:800 12px var(--ui);white-space:nowrap;padding:2px 6px;border-radius:3px}
.nl .mk::after{content:"";position:absolute;left:50%;width:2px;height:14px;transform:translateX(-50%)}
.nl .mk.ans{top:0;background:var(--gold-lo);color:#fff}
.nl .mk.ans::after{top:100%;background:var(--gold-lo)}
.nl .mk.you{top:38px;background:var(--ink);color:var(--parch)}
.nl .mk.you::after{bottom:100%;background:var(--ink)}

.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.slot{min-height:64px;border-radius:6px;border:1.5px dashed rgba(90,68,50,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;font:600 14px/1.2 var(--body);color:var(--ink)}
.slot .n{font:800 11px var(--disp);letter-spacing:.14em;color:var(--ink2)}
.slot.fill{border-style:solid;background:rgba(224,179,84,.22);cursor:pointer}
.slot.lock{border-color:var(--gold-lo);background:rgba(224,179,84,.4);cursor:default}
.slot.ok{background:rgba(224,179,84,.55);border-color:var(--gold-lo)}
.slot.bad{background:rgba(196,69,60,.22);border-color:var(--ox-hi)}
.slot .tag{font:700 12px var(--ui);color:var(--ink2);margin-top:3px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.chip{position:relative;min-height:52px;padding:10px 12px 10px 48px;text-align:left;border-radius:6px;font:500 16px/1.25 var(--body);color:var(--parch);background:linear-gradient(180deg,#27594f,#1a3f39);box-shadow:inset 0 0 0 1px rgba(224,179,84,.5),0 3px 0 #0b1f1c}
